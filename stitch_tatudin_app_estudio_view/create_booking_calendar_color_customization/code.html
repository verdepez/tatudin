<body class="min-h-screen flex flex-col font-body-md text-body-md selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- TopAppBar Semantic Shell -->
<header class="w-full top-0 sticky z-40 bg-surface dark:bg-inverse-surface flat no shadows">
<div class="flex items-center justify-between px-margin-mobile py-4 w-full max-w-container-max mx-auto">

<div class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed text-center flex-1">

<span class="material-symbols-outlined text-2xl">more_vert</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-2xl mx-auto px-margin-mobile py-8 md:py-margin-desktop pb-32">
<!-- Header Section -->
<div class="mb-10 text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-2">Create Booking Calendar</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create a public booking page for your clients.</p>
</div>
<!-- Form Canvas -->
<div class="bg-surface-container-lowest rounded-[24px] p-6 md:p-8 ambient-shadow border border-primary-fixed-dim/30">
<form class="space-y-8">
<!-- Calendar Title -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="calendar-title">Calendar Title</label>
<input class="w-full bg-surface-container-low border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-4 py-3 rounded-t-lg transition-colors text-on-surface placeholder-outline font-body-md text-body-md" id="calendar-title" placeholder="e.g., Flash Day Bookings" type="text"/>
</div>
<!-- Appointment Duration -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface">Appointment Duration</label>
<div class="grid grid-cols-3 gap-2">
<label class="cursor-pointer">
<input class="peer sr-only" name="duration" type="radio" value="30"/>
<div class="text-center px-4 py-3 rounded-lg border border-outline-variant peer-checked:bg-primary-container peer-checked:border-primary-container peer-checked:text-on-primary-container text-on-surface-variant hover:bg-surface-container-high transition-colors font-label-md text-label-md">
                                30 min
                            </div>
</label>
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="duration" type="radio" value="60"/>
<div class="text-center px-4 py-3 rounded-lg border border-outline-variant peer-checked:bg-primary-container peer-checked:border-primary-container peer-checked:text-on-primary-container text-on-surface-variant hover:bg-surface-container-high transition-colors font-label-md text-label-md">
                                1 hour
                            </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="duration" type="radio" value="custom"/>
<div class="text-center px-4 py-3 rounded-lg border border-outline-variant peer-checked:bg-primary-container peer-checked:border-primary-container peer-checked:text-on-primary-container text-on-surface-variant hover:bg-surface-container-high transition-colors font-label-md text-label-md">
                                Custom
                            </div>
</label>
</div>
</div>
<!-- Appointment Type Chips -->
<div class="space-y-3">
<label class="block font-label-md text-label-md text-on-surface">Appointment Type</label>
<div class="flex flex-wrap gap-2">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" type="checkbox"/>
<span class="inline-flex items-center px-4 py-2 rounded-full border border-outline-variant peer-checked:bg-primary-fixed peer-checked:border-primary-fixed peer-checked:text-on-primary-fixed text-on-surface-variant hover:bg-surface-container-high transition-all font-label-md text-label-md">
                                Tattoo session
                            </span>
</label>
<label class="cursor-pointer">
<input checked="" class="peer sr-only" type="checkbox"/>
<span class="inline-flex items-center px-4 py-2 rounded-full border border-outline-variant peer-checked:bg-primary-fixed peer-checked:border-primary-fixed peer-checked:text-on-primary-fixed text-on-surface-variant hover:bg-surface-container-high transition-all font-label-md text-label-md">
                                Consultation
                            </span>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" type="checkbox"/>
<span class="inline-flex items-center px-4 py-2 rounded-full border border-outline-variant peer-checked:bg-primary-fixed peer-checked:border-primary-fixed peer-checked:text-on-primary-fixed text-on-surface-variant hover:bg-surface-container-high transition-all font-label-md text-label-md">
                                Flash day
                            </span>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" type="checkbox"/>
<span class="inline-flex items-center px-4 py-2 rounded-full border border-outline-variant peer-checked:bg-primary-fixed peer-checked:border-primary-fixed peer-checked:text-on-primary-fixed text-on-surface-variant hover:bg-surface-container-high transition-all font-label-md text-label-md">
                                Touch-up
                            </span>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" type="checkbox"/>
<span class="inline-flex items-center px-4 py-2 rounded-full border border-outline-variant peer-checked:bg-primary-fixed peer-checked:border-primary-fixed peer-checked:text-on-primary-fixed text-on-surface-variant hover:bg-surface-container-high transition-all font-label-md text-label-md">
                                Custom
                            </span>
</label>

<div class="h-px bg-outline-variant/30"></div>

<button class="w-8 h-8 rounded-full bg-primary ring-2 ring-offset-2 ring-primary ring-offset-surface-container-lowest" type="button"></button>

<button class="w-8 h-8 rounded-full bg-[#9C27B0]" type="button"></button>

</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-on-surface-variant">Available Dates</label>
<div class="flex items-center gap-2 bg-surface-container-low p-2 rounded-lg border border-outline-variant/30">
<div class="w-6 h-6 rounded bg-surface-container-lowest border border-outline-variant/50"></div>
<span class="text-label-sm text-on-surface-variant">Default</span>
</div>
</div>
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-on-surface-variant">Booked Dates</label>
<div class="flex items-center gap-2 bg-surface-container-low p-2 rounded-lg border border-outline-variant/30">
<div class="w-6 h-6 rounded bg-primary-container"></div>
<span class="text-label-sm text-on-surface-variant">Primary</span>
</div>
</div>
</div>
</div>
</div>

<div class="aspect-square rounded flex items-center justify-center font-label-sm text-label-sm bg-primary-container text-on-primary-container font-semibold relative">

</div>
<div class="aspect-square rounded flex items-center justify-center font-label-sm text-label-sm bg-surface-container-lowest text-on-surface border border-outline-variant/50">5</div>
<div class="aspect-square rounded flex items-center justify-center font-label-sm text-label-sm text-outline-variant">6</div>
<div class="aspect-square rounded flex items-center justify-center font-label-sm text-label-sm text-outline-variant">7</div>
</div>
<div class="mt-4 flex items-center gap-4 justify-center">
<div class="flex items-center gap-1.5">
<div class="w-3 h-3 rounded-sm bg-surface-container-lowest border border-outline-variant/50"></div>
<span class="font-label-sm text-label-sm text-outline">Available</span>
</div>
<div class="flex items-center gap-1.5">
<div class="w-3 h-3 rounded-sm bg-primary-container"></div>
<span class="font-label-sm text-label-sm text-outline">Booked</span>
</div>
</div>
</div>
<!-- CTA -->
<div class="pt-6">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 px-6 rounded-xl hover:opacity-90 active:scale-[0.98] transition-all shadow-md flex items-center justify-center gap-2" type="button">
                        Continue
                        <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</form>
</div>
</main>

name: Tatudin CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 🧪 Continuous Integration & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tatudin
          POSTGRES_PASSWORD: tatudin_test_password
          POSTGRES_DB: tatudin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgres://tatudin:tatudin_test_password@localhost:5432/tatudin_test
      TEST_SKIP_CSRF: "true"

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🗄️ Initialize Database Schema & Seeds
        run: |
          PGPASSWORD=tatudin_test_password psql -h localhost -U tatudin -d tatudin_test -f database/init.sql

      - name: 🚦 Run Unit & Integration API Tests
        run: npm test

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🖥️ Run E2E UI Tests
        run: npx playwright test --project=chromium

      - name: 📊 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: 🚀 Continuous Deployment to Production
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Validate Docker Build
        run: docker build -t tatudin:latest .

      - name: 🚀 Trigger Railway Production Deployment
        if: env.RAILWAY_TOKEN != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway up --detach


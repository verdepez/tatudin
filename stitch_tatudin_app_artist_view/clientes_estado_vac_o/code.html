<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-background sticky top-0 z-40 w-full flex justify-between items-center px-margin-mobile py-unit max-w-container-max mx-auto">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer">arrow_back</span>
<h1 class="text-headline-md font-headline-md font-bold text-primary">Tatudin</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden">
<img alt="Studio Logo" class="w-full h-full object-cover" data-alt="A sophisticated professional profile avatar placeholder, representing a tattoo artist. The style is minimalist and editorial, with soft studio lighting and a palette dominated by muted purples and whites. The background is a clean, out-of-focus creative studio environment, maintaining an operational calm aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAeUsrLi1eg72gJ6Cski9kWxyDTqoWsiaGanwbE0HpEZiODw-rWQAUNfDVPs1VK5XtFhAbiQtrYcEj2HQ1xLZ8PuKMIJAhKzYMb2Q9Za97cxvlwZXOYl4Udf4BiF6mst5gHAGzS20I9GWh8cmtlpxptFzeUG85SRfjqj-wcOPHRpEl70-Bblx5sS7yQgfxqoD89KDNm7oSJihs7ROnOcLyfScWSwhJ0BIuIHpWOvRo31K_tBpj1n9XfvLsBmAvg4QFTUN4UCKNJQYU">
</div>
</header>
<main class="flex-grow max-w-container-max mx-auto w-full px-margin-mobile md:px-margin-desktop py-unit">
<!-- Section Header -->
<div class="mt-8 mb-gutter">
<h2 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg text-on-background">Clientes</h2>
<p class="text-body-md font-body-md text-on-surface-variant">Gestiona tu base de clientes</p>
</div>
<!-- Quick Actions Grid -->
<div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-section-gap">
<button class="flex items-center justify-center gap-2 bg-white p-4 rounded-xl shadow-sm hover:bg-surface-container-low transition-colors border border-outline-variant/20">
<span class="material-symbols-outlined text-primary">qr_code_2</span>
<span class="text-label-md font-label-md text-on-surface">QR registro</span>
</button>
<button class="flex items-center justify-center gap-2 bg-white p-4 rounded-xl shadow-sm hover:bg-surface-container-low transition-colors border border-outline-variant/20">
<span class="material-symbols-outlined text-primary">description</span>
<span class="text-label-md font-label-md text-on-surface">Formularios</span>
</button>
<button class="col-span-2 md:col-span-1 flex items-center justify-center gap-2 bg-on-tertiary-fixed-variant text-white p-4 rounded-xl shadow-sm hover:opacity-90 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="text-label-md font-label-md">Nuevo cliente</span>
</button>
</div>
<!-- Search and Toggles (Visual Context for Empty State) -->
<div class="flex flex-col md:flex-row gap-4 mb-gutter items-center">
<div class="relative w-full md:flex-grow">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>
<input class="w-full bg-surface-container-low border-none rounded-full py-3 pl-12 pr-4 text-body-md font-body-md focus:ring-2 focus:ring-primary-container" placeholder="Buscar clientes..." type="text">
</div>
<div class="flex bg-surface-container-high p-1 rounded-full">
<button class="px-6 py-2 rounded-full bg-white text-primary text-label-sm font-label-sm shadow-sm">Todos</button>
<button class="px-6 py-2 rounded-full text-on-surface-variant text-label-sm font-label-sm">Recientes</button>
</div>
</div>
<!-- Empty State Canvas -->
<div class="flex flex-col items-center justify-center py-section-gap text-center max-w-lg mx-auto">
<div class="w-64 h-64 mb-gutter rounded-full bg-gradient-to-tr from-surface-container-low to-surface-container-highest flex items-center justify-center relative overflow-hidden">
<img alt="Empty State Illustration" class="w-40 h-40 opacity-20 grayscale" data-alt="A minimalist and clean digital illustration of a stylized tattoo machine and a digital tablet, floating elegantly in a void of soft lavender and pristine white. The art style is inspired by modern productivity apps like Notion, with thin line work and subtle organic shapes. The atmosphere is quiet, professional, and sophisticated, reflecting the concept of operational calm." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCd09IarZAIQ0FqMRBC75CNcgGtD0fysvRNngF9RwO7yBOqgCYMCt1EnHc7Er7DdL-Yo6ALV7u_cFWJdDBha8TrFsGJwEUMjB7dE5NxhQRlvRK1zhCQYB6ScyvwMrcHirjeuH132GBMkuu_4sL2HhQuFfqgkPXBOUqHrXR2JUnN2RchPM24L5xEVKowuoVn95PPxvv15lHW1QcXrUgZp-_LXD-N2a1HFteKDVFi4FC_kJtQf2IXGYaQmxifSWOAVml76XIzF2a8Dbw">
<span class="material-symbols-outlined text-[80px] text-primary-container/10 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">person_search</span>
</div>
<h3 class="text-headline-md font-headline-md text-on-background mb-unit">No hay clientes aún</h3>
<p class="text-body-md font-body-md text-on-surface-variant mb-gutter">Registra a tu primer cliente para comenzar a gestionar tu estudio</p>
<button class="flex items-center gap-2 bg-primary text-on-primary px-8 py-4 rounded-full font-label-md text-label-md shadow-lg hover:scale-[1.02] active:scale-95 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person_add</span>
                Nuevo cliente
            </button>
</div>
</main>
<!-- BottomNavBar -->

<!-- Desktop Sidebar Simulation for context (hidden on mobile) -->
<div class="hidden md:block">
<div class="fixed left-0 top-0 h-full w-20 flex flex-col items-center py-10 bg-white shadow-xl z-50">
<div class="w-12 h-12 bg-primary rounded-xl mb-10 flex items-center justify-center text-white">
<span class="material-symbols-outlined">ink_pen</span>
</div>
<div class="flex flex-col gap-8">
<span class="material-symbols-outlined text-outline cursor-pointer hover:text-primary">dashboard</span>
<span class="material-symbols-outlined text-outline cursor-pointer hover:text-primary">calendar_today</span>
<span class="material-symbols-outlined text-outline cursor-pointer hover:text-primary">payments</span>
<span class="material-symbols-outlined text-primary cursor-pointer" style="font-variation-settings: 'FILL' 1;">groups</span>
<span class="material-symbols-outlined text-outline cursor-pointer hover:text-primary">chat_bubble</span>
</div>
</div>
</div>

<div class="h-20 md:hidden"></div>
